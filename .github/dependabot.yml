version: 2
registries:
  dockerhub:
    type: docker-registry
    url: https://registry.hub.docker.com
    username: ${{secrets.DOCKERHUB_USERNAME}}
    password: ${{secrets.DOCKERHUB_TOKEN}}
    replaces-base: true
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      gomod:
        patterns:
          - "*"
  # plugin base images
  - package-ecosystem: "docker"
    directory: "/baseimages"
    open-pull-requests-limit: 10
    schedule:
      interval: "daily"
    # Minimize delay for base image security fixes (default is 3 days).
    cooldown:
      default-days: 1
    registries:
      - dockerhub
    groups:
      distroless:
        patterns:
          - "distroless/*"
