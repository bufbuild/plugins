version: v1
name: buf.build/bufbuild/grpc-py
plugin_version: v0.3.0
source_url:  https://github.com/bufbuild/protoc-gen-grpc-py/
description: Generates gRPC-Python stubs that use protobuf-py.
deps:
  - plugin: buf.build/bufbuild/py:v0.3.0
spdx_license_id: Apache-2.0
license_url: https://github.com/bufbuild/protoc-gen-grpc-py/blob/v0.3.0/LICENSE
output_languages:
- python
registry:
  python:
    package_type: "runtime"
    requires_python: ">=3.10"
    deps:
      # https://pypi.org/project/grpcio/
      - "grpcio>=1.68"
